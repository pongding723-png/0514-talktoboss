<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>保安組條陳自動化產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Microsoft JhengHei', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .report-preview { white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; word-break: break-all; }
        input, textarea, select { font-size: 16px !important; border-radius: 0.75rem; border: 1px solid #cbd5e1; padding: 0.8rem; width: 100%; transition: all 0.2s; background: white; }
        input:focus, textarea:focus { border-color: #3b82f6; ring: 3px; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        label { font-weight: 700; font-size: 0.9rem; color: #334155; margin-bottom: 0.4rem; display: block; }
        .mode-btn { flex: 1; padding: 1rem 0.5rem; font-weight: bold; border-radius: 1rem; transition: all 0.3s; border: 2px solid transparent; }
        .mode-btn.active { background-color: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .mode-btn.inactive { background-color: white; color: #64748b; border-color: #e2e8f0; }
        .touch-button { active: transform: scale(0.96); transition: transform 0.1s; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid rgba(255,255,255,0.7); }
    </style>
</head>
<body class="p-3 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">保安組條陳自動產生器</h1>
        </header>

        <div class="flex space-x-2 mb-6 bg-white/50 p-1.5 rounded-2xl border border-slate-200">
            <button onclick="setMode('closing')" id="btn-closing" class="mode-btn active">結報</button>
            <button onclick="setMode('single')" id="btn-single" class="mode-btn inactive">單報</button>
            <button onclick="setMode('project')" id="btn-project" class="mode-btn inactive">專案</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左側：輸入區域 -->
            <div class="card p-5 md:p-8">
                <div id="sub-mode-container" class="hidden mb-6 grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <button onclick="setProjectSubMode('planning')" id="btn-p-plan" class="p-sub-btn py-3 text-sm rounded-xl border-2 font-bold transition-all">規劃</button>
                    <button onclick="setProjectSubMode('initial')" id="btn-p-init" class="p-sub-btn py-3 text-sm rounded-xl border-2 font-bold transition-all">初報</button>
                    <button onclick="setProjectSubMode('update')" id="btn-p-upd" class="p-sub-btn py-3 text-sm rounded-xl border-2 font-bold transition-all">續報</button>
                    <button onclick="setProjectSubMode('final')" id="btn-p-fin" class="p-sub-btn py-3 text-sm rounded-xl border-2 font-bold transition-all">結報</button>
                </div>
                <div id="form-container" class="space-y-5"></div>
            </div>

            <!-- 右側：預覽區域 -->
            <div class="sticky top-6">
                <div class="bg-slate-900 text-slate-100 p-6 md:p-8 rounded-[2rem] shadow-2xl flex flex-col min-h-[550px] lg:min-h-[750px] border-4 border-slate-800">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <h2 class="text-xl font-bold flex items-center tracking-wide">
                            <span class="mr-3 text-blue-400">📋</span> 條陳預覽
                        </h2>
                        <button onclick="copyReport()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl text-sm font-black shadow-lg shadow-blue-900/20 touch-button transition-all">
                            複製全文
                        </button>
                    </div>
                    <div id="report-output" class="report-preview text-base md:text-lg leading-relaxed flex-grow overflow-auto mb-6 bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50"></div>
                    
                    <div class="pt-5 border-t border-slate-700">
                        <div class="flex items-center space-x-4">
                            <label class="mb-0 text-slate-400 whitespace-nowrap font-medium">職章姓名：</label>
                            <input type="text" id="signer-name" value="王炳睿" oninput="updateReport()" class="bg-slate-800 text-white border-slate-600 w-36 py-2 px-4 rounded-xl text-sm font-bold">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'closing';
        let projectSubMode = 'planning';
        const d = new Date();
        const todayDate = d.getDate();
        const nextDate = new Date(d.getTime() + 86400000).getDate();

        const toChineseNum = (n) => ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'][n] || n;

        // 格式化段落，處理自動換行與編號
        function formatPoints(text) {
            if (!text) return "";
            return text.split('\n')
                .map(l => l.trim())
                .filter(l => l !== '')
                .map((l, i) => {
                    const cleanLine = l.replace(/^[\(（][一二三四五六七八九十0-9]+[\)）]/, '').replace(/^[一二三四五六七八九十0-9]+[\.、]/, '').trim();
                    return `（${toChineseNum(i + 1)}）${cleanLine}`;
                }).join('\n');
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('inactive');
            });
            document.getElementById(`btn-${mode}`).classList.add('active');
            document.getElementById(`btn-${mode}`).classList.remove('inactive');
            document.getElementById('sub-mode-container').classList.toggle('hidden', mode !== 'project');
            renderForm();
        }

        function setProjectSubMode(sub) {
            projectSubMode = sub;
            document.querySelectorAll('.p-sub-btn').forEach(btn => {
                btn.className = 'p-sub-btn py-3 text-sm rounded-xl border-2 border-slate-100 text-slate-400 font-bold';
            });
            const map = { planning: 'btn-p-plan', initial: 'btn-p-init', update: 'btn-p-upd', final: 'btn-p-fin' };
            document.getElementById(map[sub]).className = 'p-sub-btn py-3 text-sm rounded-xl border-blue-500 bg-blue-50 text-blue-700 font-bold';
            renderForm();
        }

        function renderForm() {
            const container = document.getElementById('form-container');
            if (currentMode === 'closing') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 shadow-sm">
                            <p class="font-bold text-blue-800 mb-4 flex items-center text-lg"><span class="mr-2">📅</span> 本日 (${todayDate}日)</p>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div><label>總場次</label><input type="number" id="t-total" value="0" oninput="updateReport()"></div>
                                <div><label>重要場次</label><input type="number" id="t-imp-count" value="0" oninput="handleImpChange('t')"></div>
                            </div>
                            <div id="t-imp-fields" class="space-y-4"></div>
                        </div>
                        <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 shadow-sm">
                            <p class="font-bold text-emerald-800 mb-4 flex items-center text-lg"><span class="mr-2">📅</span> 明日 (${nextDate}日)</p>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div><label>總場次</label><input type="number" id="n-total" value="0" oninput="updateReport()"></div>
                                <div><label>重要場次</label><input type="number" id="n-imp-count" value="0" oninput="handleImpChange('n')"></div>
                            </div>
                            <div id="n-imp-fields" class="space-y-4"></div>
                        </div>
                    </div>`;
            } else if (currentMode === 'single') {
                container.innerHTML = `
                    <div class="space-y-5">
                        <div><label>案件名稱</label><input id="s-title" placeholder="如：OO抗議案" oninput="updateReport()"></div>
                        <div><label>一、案情摘要</label><textarea id="s-summary" rows="5" placeholder="請輸入案情..." oninput="updateReport()"></textarea></div>
                        <div><label>二、後續處置 (自動編號)</label><textarea id="s-action" rows="6" placeholder="請輸入處置情形..." oninput="updateReport()"></textarea></div>
                        <div><label>提報單位</label><input id="s-unit" placeholder="屏東縣警局" oninput="updateReport()"></div>
                    </div>`;
            } else {
                container.innerHTML = renderProjectFields();
            }
            updateReport();
        }

        function handleImpChange(day) {
            const count = parseInt(document.getElementById(`${day}-imp-count`).value) || 0;
            const field = document.getElementById(`${day}-imp-fields`);
            field.innerHTML = '';
            for(let i=1; i<=count; i++) {
                const div = document.createElement('div');
                div.className = "p-5 bg-white border-2 border-slate-100 rounded-2xl shadow-sm space-y-4 mb-4";
                if(day === 't') {
                    div.innerHTML = `<p class="font-black text-sm text-blue-600 border-b pb-2 tracking-widest">重要場次 ${i}</p>
                        <input placeholder="團體人名" class="t-who-${i}" oninput="updateReport()">
                        <input placeholder="事由" class="t-why-${i}" oninput="updateReport()">
                        <input placeholder="地點" class="t-where-${i}" oninput="updateReport()">
                        <div class="grid grid-cols-2 gap-3"><select class="t-type-${i}" oninput="updateReport()"><option>集會</option><option>遊行</option><option>集會遊行</option></select>
                        <input placeholder="人數" class="t-num-${i}" oninput="updateReport()"></div>
                        <div class="grid grid-cols-2 gap-3"><input placeholder="開始時間(1010)" class="t-start-${i}" oninput="updateReport()">
                        <input placeholder="結束時間(1045)" class="t-end-${i}" oninput="updateReport()"></div>
                        <input placeholder="狀況(狀況平和)" class="t-status-${i}" value="狀況平和" oninput="updateReport()">`;
                } else {
                    div.innerHTML = `<p class="font-black text-sm text-emerald-600 border-b pb-2 tracking-widest">明日重要場次 ${i}</p>
                        <input placeholder="團體人名" class="n-who-${i}" oninput="updateReport()">
                        <input placeholder="事由" class="n-why-${i}" oninput="updateReport()">
                        <input placeholder="地點" class="n-where-${i}" oninput="updateReport()">
                        <div class="grid grid-cols-2 gap-3"><select class="n-type-${i}" oninput="updateReport()"><option>集會</option><option>遊行</option><option>集會遊行</option></select>
                        <input placeholder="時間(10時)" class="n-time-${i}" oninput="updateReport()"></div>
                        <input placeholder="預估人數" class="n-num-${i}" oninput="updateReport()">`;
                }
                field.appendChild(div);
            }
            updateReport();
        }

        function updateReport() {
            const name = document.getElementById('signer-name').value;
            let report = "";
            if (currentMode === 'closing') report = generateClosing(name);
            else if (currentMode === 'single') report = generateSingle(name);
            else report = generateProject(name);
            document.getElementById('report-output').textContent = report;
        }

        function generateClosing(name) {
            const tTotal = document.getElementById('t-total').value || 0;
            const tImp = parseInt(document.getElementById('t-imp-count').value) || 0;
            const nTotal = document.getElementById('n-total').value || 0;
            const nImp = parseInt(document.getElementById('n-imp-count').value) || 0;

            let line1 = `一、本（${todayDate}）日全國警察機關防處聚眾活動計${tTotal}場`;
            if (tImp === 0) {
                line1 += `，無危安顧慮之聚眾活動，均由轄區警察局自行規劃勤務防處，本組併續掌控。\n`;
            } else {
                line1 += `，其中重要場次計有${tImp}場，摘要如下：\n`;
                for(let i=1; i<=tImp; i++) {
                    const who = document.querySelector(`.t-who-${i}`)?.value || "【團體】";
                    const why = document.querySelector(`.t-why-${i}`)?.value || "【事由】";
                    const where = document.querySelector(`.t-where-${i}`)?.value || "【地點】";
                    const type = document.querySelector(`.t-type-${i}`)?.value || "集會";
                    const s = document.querySelector(`.t-start-${i}`)?.value || "0000";
                    const e = document.querySelector(`.t-end-${i}`)?.value || "0000";
                    const n = document.querySelector(`.t-num-${i}`)?.value || "0";
                    const st = document.querySelector(`.t-status-${i}`)?.value || "狀況平和";
                    line1 += `${tImp>1?`（${toChineseNum(i)}）`:""}「${who}」等人，以「${why}」為由，假${where}舉行${type}活動，${s}活動開始，${e}活動結束，現場人數${n}人，${st}。\n`;
                }
            }

            let line2 = "";
            let idx = 2;
            if (tImp > 0) {
                line2 = `\n二、其餘本日較無危安顧慮之聚眾活動，均由轄區警察局自行規劃勤務防處，本組併續掌控。\n\n`;
                idx = 3;
            } else {
                line1 += "\n";
            }

            let line3 = `${toChineseNum(idx)}、明（${nextDate}）日全國警察機關防處聚眾活動計${nTotal}場`;
            if (nImp === 0) {
                line3 += `，尚無其他重要活動情資，本組偕同保防組及各警察機關持續掌握，遇況即時陳報。`;
            } else {
                line3 += `，其中較重要場次${nImp}場，活動概況如下：\n`;
                for(let i=1; i<=nImp; i++) {
                    const who = document.querySelector(`.n-who-${i}`)?.value || "【團體】";
                    const why = document.querySelector(`.n-why-${i}`)?.value || "【事由】";
                    const where = document.querySelector(`.n-where-${i}`)?.value || "【地點】";
                    const type = document.querySelector(`.n-type-${i}`)?.value || "集會";
                    const t = document.querySelector(`.n-time-${i}`)?.value || "00時";
                    const n = document.querySelector(`.n-num-${i}`)?.value || "0";
                    line3 += `${nImp>1?`（${toChineseNum(i)}）`:""}「${who}」等人，以「${why}」為由，預計於${t}假${where}舉行${type}活動，預估人數${n}人。\n`;
                }
                line3 += `\n本組將偕同保防組及轄區警察局持續掌握，遇況即時陳報。`;
            }
            return `保安組報告（結報）：\n\n${line1}${line2}${line3}\n\n　　職 ${name} 敬陳`;
        }

        function generateSingle(name) {
            const t = document.getElementById('s-title').value || "OO案";
            const s = document.getElementById('s-summary').value || "";
            const a = formatPoints(document.getElementById('s-action').value);
            const u = document.getElementById('s-unit').value || "【提報單位】";
            return `保安組報告（${t}）：\n\n一、案情摘要：\n${s}\n\n二、後續處置：\n${a}\n\n三、本組偕同${u}持續掌握，遇況即時陳報。\n\n　　職 ${name} 敬陳`;
        }

        function renderProjectFields() {
            const common = `<div class="mb-4"><label>專案名稱</label><input id="p-title" placeholder="如：0316專案" oninput="updateReport()"></div>`;
            
            if(projectSubMode === 'planning') {
                return common + `<div class="space-y-4">
                <div><label>一、狀況 (人事時地物)</label><textarea id="p-st" rows="4" oninput="updateReport()"></textarea></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label>防處機關</label><input id="p-unit" oninput="updateReport()"></div>
                    <div><label>指揮官</label><input id="p-cmd" placeholder="分局長OOO" oninput="updateReport()"></div>
                    <div><label>分區數</label><input id="p-zone" placeholder="4分區" oninput="updateReport()"></div>
                    <div><label>警力數</label><input id="p-pol" placeholder="135名" oninput="updateReport()"></div>
                </div>
                <div><label>阻材描述</label><input id="p-bar" value="交通改道牌30面" oninput="updateReport()"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label>本署開設</label><input id="p-lv-1" value="8時30分起三級開設" oninput="updateReport()"></div>
                    <div><label>機關開設</label><input id="p-lv-2" value="8時起三級開設" oninput="updateReport()"></div>
                </div></div>`;
            } else if(projectSubMode === 'initial') {
                return common + `<div class="space-y-4">
                <div><label>一、狀況 (人事時地)</label><textarea id="pi-1" rows="4" oninput="updateReport()"></textarea></div>
                <div><label>二、勤務部署情形</label><textarea id="pi-2" rows="3" oninput="updateReport()"></textarea></div>
                <div><label>三、目前現場狀況 (自動編號)</label><textarea id="pi-3" rows="4" oninput="updateReport()"></textarea></div></div>`;
            } else if(projectSubMode === 'update') {
                return common + `<div class="space-y-4">
                <div><label>一、狀況 (簡述，句末會自動補陳報於前)</label><textarea id="pu-1" rows="2" oninput="updateReport()"></textarea></div>
                <div><label>二、目前活動狀況 (自動編號)</label><textarea id="pu-2" rows="6" oninput="updateReport()"></textarea></div></div>`;
            } else {
                return common + `<div class="space-y-4">
                <div><label>一、狀況 (簡述)</label><textarea id="pf-1" rows="3" oninput="updateReport()"></textarea></div>
                <div><label>二、目前現場狀況 (自動編號)</label><textarea id="pf-2" rows="4" oninput="updateReport()"></textarea></div>
                <div><label>三、擬處內容</label><textarea id="pf-3" rows="3" oninput="updateReport()" placeholder="「OO專案」本署10時30分結束三級開設..."></textarea></div></div>`;
            }
        }

        function generateProject(name) {
            const t = document.getElementById('p-title').value || "專案";
            const tail = `\n\n　　職 ${name} 敬陳`;
            const space = "\n\n";

            if(projectSubMode === 'planning') {
                return `保安組報告：\n${t}規劃執行情形\n\n一、狀況：\n${document.getElementById('p-st').value}${space}二、勤務規劃：\n陳情活動現場由${document.getElementById('p-unit').value}防處，${document.getElementById('p-cmd').value}擔任指揮官，規劃${document.getElementById('p-zone').value}分區，共計使用警力${document.getElementById('p-pol').value}名；${document.getElementById('p-bar').value}。${space}三、專案聯合指揮所開設：\n（一）本署：${document.getElementById('p-lv-1').value}。\n（二）各機關：${document.getElementById('p-lv-2').value}。` + tail;
            }
            if(projectSubMode === 'initial') {
                return `保安組報告（${t}初報）：\n\n一、狀況：\n${formatPoints(document.getElementById('pi-1').value)}${space}二、勤務部署情形：\n${document.getElementById('pi-2').value}${space}三、目前現場狀況：\n${formatPoints(document.getElementById('pi-3').value)}${space}四、本組持續與各專案任務編組掌握現場狀況，遇況即時陳報。` + tail;
            }
            if(projectSubMode === 'update') {
                return `保安組報告（${t}--續報）：\n\n一、${document.getElementById('pu-1').value}，活動概況已陳報於前。${space}二、目前活動狀況：\n${formatPoints(document.getElementById('pu-2').value)}${space}三、本組持續與各專案任務編組掌握現場狀況，遇況即時陳報。` + tail;
            }
            return `保安組報告（${t}結報）：\n\n一、狀況：\n${document.getElementById('pf-1').value}${space}二、目前現場狀況：\n${formatPoints(document.getElementById('pf-2').value)}${space}三、擬處：\n${document.getElementById('pf-3').value}` + tail;
        }

        function copyReport() {
            const text = document.getElementById('report-output').textContent;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            const btn = document.querySelector('button[onclick="copyReport()"]');
            const originalText = btn.innerText;
            btn.innerText = "✅ 已複製";
            btn.classList.replace('bg-blue-600', 'bg-emerald-600');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-emerald-600', 'bg-blue-600');
            }, 2000);
        }

        window.onload = renderForm;
    </script>
</body>
</html>
